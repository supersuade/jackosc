[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jackosc"
version = "0.1.0"
description = "JACK audio to OSC bridge with a live analysis web UI"
requires-python = ">=3.11"
dependencies = [
  "jack-client>=0.5.5",
  "numpy>=1.26",
  "python-osc>=1.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
jackosc = "jackosc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jackosc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
